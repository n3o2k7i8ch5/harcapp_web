<!DOCTYPE html>
<html lang="pl">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
 
  <!-- SEO: baseline metadata for crawlability, canonical URL, and link previews (OpenGraph/Twitter). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HarcApp – aplikacja dla harcerzy: śpiewnik, sprawności, konspekty zajęć, poradnik i artykuły. Dodawaj i edytuj piosenki w śpiewniku HarcApp.">
  <link rel="canonical" href="https://harcapp.web.app/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HarcApp">
  <meta property="og:title" content="HarcApp">
  <meta property="og:description" content="HarcApp – aplikacja dla harcerzy: śpiewnik, sprawności, konspekty zajęć, poradnik i artykuły. Dodawaj i edytuj piosenki w śpiewniku HarcApp.">
  <meta property="og:url" content="https://harcapp.web.app/">
  <meta property="og:image" content="https://harcapp.web.app/icons/icon-512.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HarcApp">
  <meta name="twitter:description" content="HarcApp – aplikacja dla harcerzy: śpiewnik, sprawności, konspekty zajęć, poradnik i artykuły. Dodawaj i edytuj piosenki w śpiewniku HarcApp.">
  <meta name="twitter:image" content="https://harcapp.web.app/icons/icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HarcApp">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <title>HarcApp</title>
  <link rel="manifest" href="manifest.json">

  <!-- SEO: #seo-content holds the page's text as plain HTML for search engines
       (Flutter draws everything itself, so crawlers would otherwise see no text).
       The share_pages generator (tool/share_pages) fills it per page at deploy.
       Visually hidden, like screen-reader-only text: users see the Flutter app. -->
  <style>
    #seo-content, #seo-nav {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
      white-space: nowrap; border: 0;
    }
  </style>

  <!-- WebLLM: in-browser LLM inference engine (WebGPU). Used for the on-device
       content checks (language / narration). Loaded as an ES module from a CDN;
       module scripts are deferred, so we expose a readiness promise that Dart
       awaits before touching `window.webllm`. No HuggingFace token needed —
       models (e.g. Qwen3-1.7B) are ungated MLC builds. -->
  <script type="module">
    window.webLlmReady = (async () => {
      const m = await import('https://esm.run/@mlc-ai/web-llm');
      window.webllm = m;
      return true;
    })();
  </script>
</head>
<body>
  <!-- seo-content:start -->
  <div id="seo-content">
    <h1>HarcApp</h1>
    <p>HarcApp – aplikacja dla harcerzy: śpiewnik, sprawności, konspekty zajęć, poradnik i artykuły. Dodawaj i edytuj piosenki w śpiewniku HarcApp.</p>
  </div>
  <!-- seo-content:end -->
  <nav id="seo-nav" aria-label="HarcApp">
    <!-- Kept outside seo-content so every page links to the main sections. -->
    <a href="/sprawnosci">Sprawności</a>
    <a href="/konspekty/harcerskie">Konspekty harcerskie</a>
    <a href="/konspekty/ksztalcenie">Konspekty kształceniowe</a>
    <a href="/poradnik">Poradnik</a>
    <a href="/articles">Artykuły</a>
    <a href="/song">Śpiewnik – dodaj piosenkę</a>
  </nav>
  <script>
    // Once Flutter draws, its own semantics take over for screen readers.
    window.addEventListener('flutter-first-frame', function () {
      ['seo-content', 'seo-nav'].forEach(function (id) {
        var e = document.getElementById(id);
        if (e) e.setAttribute('aria-hidden', 'true');
      });
    });
  </script>
  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter.js');
      });
    }
  </script>
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
